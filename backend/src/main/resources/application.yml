server:
  port: 8080

spring:
  application:
    name: intj-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:4000/intj_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
